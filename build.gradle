plugins {
    id 'java'
    //id 'checkstyle'
    id 'com.github.johnrengelman.shadow' version '8.1.0'
}

group = 'com.sk89q.worldedit'
version = '6.1.9-SNAPSHOT'

println """
*******************************************
 You are building WorldEdit!

 If you encounter trouble:
 1) Read COMPILING.md if you haven't yet
 2) Try running 'build' in a separate Gradle run
 3) Use gradlew and not gradle

 Output files will be in [subproject]/build/libs
*******************************************
"""

subprojects {
    apply plugin: 'java'
    //apply plugin: 'checkstyle'
    apply plugin: 'com.github.johnrengelman.shadow'

    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'

    //checkstyle.configFile = file("${rootProject.projectDir}/config/checkstyle/checkstyle.xml")
    //checkstyle.toolVersion = '7.6.1'

    repositories {
        mavenCentral()
        maven { url "https://maven.enginehub.org/artifactory/ext-release-local/" }
        maven { url "https://maven.enginehub.org/artifactory/libs-release-local/" }
        // TODO: Figure out what to do with dead maven repos.
    }

    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
    }

    tasks.register('javadocJar', Jar) {
        archiveClassifier.set('javadoc')
        from javadoc.destinationDir
    }

    tasks.withType(Copy).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    artifacts {
        archives jar
        archives javadocJar
    }

    if (!(name.equals('worldedit-forge') || name.equals('worldedit-sponge'))) {
        tasks.register('sourcesJar', Jar) {
            archiveClassifier.set('sources')
            from sourceSets.main.allSource

            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }

        artifacts {
            archives sourcesJar
        }

        build.dependsOn(sourcesJar)
    }

    //build.dependsOn(checkstyleMain)
    //build.dependsOn(checkstyleTest)
    build.dependsOn(javadocJar)

    shadowJar {
        archiveClassifier.set('dist')
        dependencies {
            include(dependency('com.sk89q:jchronic:0.2.4a'))
            include(dependency('com.thoughtworks.paranamer:paranamer:2.6'))
            include(dependency('com.sk89q.lib:jlibnoise:1.0.0'))
        }
        exclude 'GradleStart**'
        exclude '.cache'
        exclude 'LICENSE*'
    }
}